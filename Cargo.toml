[package]
name = "split-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# GraphQL
async-graphql = { version = "7", features = ["chrono", "dataloader"] }
async-graphql-axum = "7"

# Web server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "uuid"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Utilities
serde = { version = "1", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15.7"
